<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebNote</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <img src="icons/icon48.png" alt="" width="24" height="24">
    <h1>WebNote</h1>
    <label class="switch header-switch" title="Turn WebNote on or off">
      <input type="checkbox" id="master-enabled" role="switch" aria-label="Turn WebNote on or off" checked>
      <span class="slider"></span>
    </label>
  </header>
  <p id="off-note" class="off-note" role="status" hidden>WebNote is off. Pages stay exactly as they are.</p>

  <section class="card" aria-label="Overview and settings">
    <div class="stat-item">
      <span>Notes on this page</span>
      <span id="page-count" class="stat-val">0</span>
    </div>
    <div class="stat-item">
      <span>All notes</span>
      <span id="total-count" class="stat-val">0</span>
    </div>

    <div class="setting-item">
      <span class="setting-label">Show icon on new sites</span>
      <label class="switch">
        <input type="checkbox" id="auto-show-fab" role="switch" aria-label="Show icon on new sites" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="setting-item stacked">
      <label class="setting-row" for="bubble-opacity-slider">
        <span class="setting-label">Icon opacity</span>
        <span id="bubble-opacity-val" class="stat-val">80%</span>
      </label>
      <input type="range" id="bubble-opacity-slider" min="10" max="100" value="80">
    </div>
  </section>

  <div class="actions">
    <button id="add-note" class="btn btn-primary">Add note to page</button>
    <button id="toggle-toolbar" class="btn btn-secondary">Show or hide toolbar</button>
    <button id="open-dashboard" class="btn btn-secondary">Open dashboard</button>
  </div>

  <footer class="footer">
    <span id="version" class="version-text">v2.2.0</span>
    <a href="#" id="feedback-link" class="feedback-link">Feedback</a>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
