<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}img{display:block}</style></head>
<body><img id="i" alt=""><script>
const q = new URLSearchParams(location.search);
const i = document.getElementById('i');
i.width = i.height = +q.get('size');
window.__READY = false;
i.onload = () => { window.__READY = true; };
i.src = '/brand/' + (q.get('svg') || 'logo') + '.svg';
</script></body></html>
