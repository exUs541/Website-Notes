<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>compose</title>
<style>
  :root { --ink: #1b1a4a; --muted: #4a4d7a; --brand: #5b5ff0; --brand-d: #4033c9; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { position: relative; font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; color: var(--ink);
    background:
      radial-gradient(900px 520px at 8% -10%, rgba(139,143,255,.38), transparent 60%),
      radial-gradient(800px 520px at 100% 0%, rgba(255,212,59,.22), transparent 55%),
      radial-gradient(700px 500px at 60% 120%, rgba(255,92,122,.14), transparent 60%),
      linear-gradient(160deg, #f3f4ff 0%, #ecefff 55%, #f7f3ff 100%); }
  body.dark { color: #fff; background:
      radial-gradient(70% 90% at 0% 0%, rgba(139,143,255,.55), transparent 60%),
      radial-gradient(60% 80% at 100% 100%, rgba(255,92,122,.30), transparent 60%),
      linear-gradient(135deg, #3a2fc0 0%, #2b2599 55%, #1b1a4a 100%); }

  .brand { position: absolute; display: flex; align-items: center; gap: 12px; font-weight: 650; font-size: 22px; letter-spacing: -.01em; }
  .brand img { width: 44px; height: 44px; display: block; filter: drop-shadow(0 6px 14px rgba(64,51,201,.35)); }
  h1 { position: absolute; margin: 0; font-weight: 750; letter-spacing: -.025em; line-height: 1.06; }
  .sub { position: absolute; font-size: 22px; line-height: 1.4; color: var(--muted); font-weight: 500; }
  body.dark .sub { color: #dfe1ff; }

  .chips { position: absolute; display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 9px; padding: 9px 16px 9px 13px; border-radius: 999px; background: rgba(255,255,255,.82); border: 1px solid rgba(91,95,240,.22);
    font-weight: 600; font-size: 17px; color: var(--ink); box-shadow: 0 4px 14px rgba(64,51,201,.08); white-space: nowrap; }
  .chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--brand); display: block; }
  .chip:nth-child(2) i { background: #ffb800; } .chip:nth-child(3) i { background: #ff5c7a; } .chip:nth-child(4) i { background: #14b8a6; }
  body.dark .chip { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.28); color: #fff; box-shadow: none; }

  .win { position: absolute; background: #fff; border-radius: 14px; overflow: hidden;
    box-shadow: 0 34px 80px rgba(27,26,74,.30), 0 8px 24px rgba(27,26,74,.14), 0 0 0 1px rgba(27,26,74,.10); }
  .win.bleed { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .bar { height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #f1f3f9; border-bottom: 1px solid #e0e4ee; }
  .bar b { width: 11px; height: 11px; border-radius: 50%; display: block; background: #ff5f57; }
  .bar b:nth-child(2) { background: #febc2e; } .bar b:nth-child(3) { background: #28c840; }
  .url { margin-left: 14px; flex: 1; max-width: 460px; height: 22px; border-radius: 11px; background: #fff; border: 1px solid #e0e4ee; font: 12px/20px "Segoe UI", system-ui, sans-serif; color: #5d6679; padding: 0 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .holder { position: relative; overflow: hidden; }
  iframe { display: block; border: 0; background: #fff; }
  .card { position: absolute; border-radius: 14px; overflow: hidden; background: #fff; box-shadow: 0 30px 70px rgba(27,26,74,.30), 0 8px 22px rgba(27,26,74,.14), 0 0 0 1px rgba(27,26,74,.10); }
  .badge { position: absolute; white-space: nowrap; display: inline-flex; align-items: center; gap: 10px; padding: 11px 18px; border-radius: 14px; background: #1b1a4a; color: #fff; font-weight: 650; font-size: 18px; box-shadow: 0 14px 34px rgba(27,26,74,.35); }
  .badge svg { width: 22px; height: 22px; }
</style>
</head>
<body>
<script src="/scenes/compose/configs.js"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const c = CONFIGS[q.get('c')];
  if (!c) { document.body.textContent = 'unknown config'; return; }
  if (c.dark) document.body.classList.add('dark');
  const el = (tag, cls, html, style) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (style) Object.assign(e.style, style); document.body.appendChild(e); return e; };
  const px = (o) => Object.fromEntries(Object.entries(o).map(([k, v]) => [k, typeof v === 'number' && !['opacity', 'zIndex'].includes(k) ? v + 'px' : v]));
  const frame = (src, w, h, scale = 1) => {
    const f = document.createElement('iframe'); f.src = src; f.width = w; f.height = h;
    if (scale !== 1) { f.style.transformOrigin = '0 0'; f.style.transform = `scale(${scale})`; }
    return f;
  };

  for (const item of c.items || []) {
    if (item.type === 'brand') {
      const b = el('div', 'brand', `<img src="/brand/logo.svg" alt=""><span>${item.text || 'WebNote'}</span>`, px(item.at));
      if (item.size) { b.querySelector('img').style.width = b.querySelector('img').style.height = item.size + 'px'; b.style.fontSize = (item.fontSize || 22) + 'px'; }
    }
    if (item.type === 'h1') el('h1', '', item.html, px(item.at));
    if (item.type === 'sub') el('div', 'sub', item.html, px(item.at));
    if (item.type === 'chips') el('div', 'chips', item.list.map((t) => `<span class="chip"><i></i>${t}</span>`).join(''), px(item.at));
    if (item.type === 'badge') el('div', 'badge', item.html, px(item.at));
    if (item.type === 'window') {
      const s = item.scale || 1;
      const natural = item.scale ? { w: item.natural.width, h: item.natural.height } : { w: item.at.width, h: item.at.height - 36 };
      const w = el('div', 'win' + (item.bleed ? ' bleed' : ''), '', px({ ...item.at, width: natural.w * s, height: natural.h * s + 36 }));
      w.innerHTML = `<div class="bar"><b></b><b></b><b></b><span class="url">${item.url || ''}</span></div>`;
      const holder = document.createElement('div'); holder.className = 'holder'; holder.style.width = natural.w * s + 'px'; holder.style.height = natural.h * s + 'px';
      holder.appendChild(frame(item.src, natural.w, natural.h, s)); w.appendChild(holder);
    }
    if (item.type === 'card') {
      const w = el('div', 'card', '', px(item.at));
      w.appendChild(frame(item.src, item.at.width, item.at.height));
    }
    // a cut-out of a scene: only the part of the page at `offset` with the size of `at`
    if (item.type === 'crop') {
      const s = item.scale || 1;
      const w = el('div', 'card', '', px(item.at));
      const f = frame(item.src, item.frame.width, item.frame.height, s);
      f.style.position = 'absolute'; f.style.left = -item.offset.x * s + 'px'; f.style.top = -item.offset.y * s + 'px';
      w.appendChild(f);
    }
    if (item.type === 'img') el('img', '', null, { position: 'absolute', ...px(item.at) }).src = item.src;
  }

  window.__READY = false;
  const frames = [...document.querySelectorAll('iframe')];
  const t0 = Date.now();
  while (Date.now() - t0 < 25000) {
    if (frames.every((f) => { try { return f.contentWindow.__READY === true; } catch (_) { return false; } })) break;
    await new Promise((r) => setTimeout(r, 150));
  }
  window.__READY = true;
})();
</script>
</body>
</html>
