<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="WebNote logo">
  <defs>
    <linearGradient id="bg" x1="40" y1="0" x2="470" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8E92FF"/>
      <stop offset="0.55" stop-color="#5B5FF0"/>
      <stop offset="1" stop-color="#4033C9"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="92" x2="0" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDEFFF"/>
    </linearGradient>
    <linearGradient id="flap" x1="396" y1="318" x2="300" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D8DBFF"/>
      <stop offset="1" stop-color="#AEB4FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.05" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pin" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FF8FA6"/>
      <stop offset="0.45" stop-color="#FF4D6D"/>
      <stop offset="1" stop-color="#D81B4A"/>
    </radialGradient>
    <filter id="pinshadow" x="-50%" y="-40%" width="200%" height="220%">
      <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#1B1664" flood-opacity="0.38"/>
    </filter>
    <filter id="shadow" x="-25%" y="-20%" width="150%" height="155%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#1B1664" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>

  <g transform="translate(-25.6 -19.6) scale(1.1)">
  <!-- sticky note with folded corner -->
  <g filter="url(#shadow)">
    <path d="M156 92H356a40 40 0 0 1 40 40V318L318 420H156a40 40 0 0 1-40-40V132a40 40 0 0 1 40-40Z" fill="url(#sheet)"/>
  </g>
  <path d="M396 318 318 420 298 345a24 24 0 0 1 24-27Z" fill="url(#flap)"/>

  <!-- text line, highlighted line, squiggle -->
  <rect x="164" y="152" width="190" height="26" rx="13" fill="#C9CEFF"/>
  <rect x="150" y="208" width="216" height="52" rx="15" fill="#FFD43B"/>
  <rect x="172" y="226" width="152" height="18" rx="9" fill="#4338CA"/>
  <rect x="164" y="286" width="124" height="26" rx="13" fill="#C9CEFF"/>
  <path d="M164 356c16-22 32-22 48 0s32 22 48 0 20-14 26-8" fill="none" stroke="#FF5C7A" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- pin -->
  <g filter="url(#pinshadow)">
    <circle cx="256" cy="86" r="31" fill="url(#pin)"/>
  </g>
  <circle cx="245" cy="75" r="9" fill="#FFFFFF" opacity="0.7"/>
  </g>
</svg>
